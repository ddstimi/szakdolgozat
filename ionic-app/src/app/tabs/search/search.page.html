<ion-content [fullscreen]="true" class="search-content">
  <div id="container">
    <div class="search-wrapper">
      <div class="recent-searches" *ngIf="recentSearches.length">
        <ion-chip
          *ngFor="let item of recentSearches"
          (click)="useRecentSearch(item)"
        >
          <ion-label>{{ item }}</ion-label>
        </ion-chip>
      </div>

      <div class="filters">
        <ion-select
          placeholder="Select city"
          [(ngModel)]="selectedCity"
          (ionChange)="onFilterChange()"
        >
          <ion-select-option value="">All cities</ion-select-option>
          <ion-select-option *ngFor="let city of cities" [value]="city"
            >{{ city }}</ion-select-option
          >
        </ion-select>

        <ion-select
          placeholder="Select genre"
          [(ngModel)]="selectedGenre"
          (ionChange)="onFilterChange()"
        >
          <ion-select-option value="">All genres</ion-select-option>
          <ion-select-option *ngFor="let genre of genres" [value]="genre"
            >{{ genre }}</ion-select-option
          >
        </ion-select>
        <div class="date-chip-row">
          <ion-chip
            class="blue-chip"
            [color]="selectedDateRange === '' ? 'primary' : 'medium'"
            (click)="selectedDateRange = ''; onFilterChange()"
          >
            <ion-label>All Dates</ion-label>
          </ion-chip>

          <ion-chip
            class="blue-chip"
            [color]="selectedDateRange === 'today' ? 'primary' : 'medium'"
            (click)="selectedDateRange = 'today'; onFilterChange()"
          >
            <ion-label>Today</ion-label>
          </ion-chip>

          <ion-chip
            class="blue-chip"
            [color]="selectedDateRange === 'weekend' ? 'primary' : 'medium'"
            (click)="selectedDateRange = 'weekend'; onFilterChange()"
          >
            <ion-label>This Weekend</ion-label>
          </ion-chip>

          <ion-chip
            class="blue-chip"
            [color]="selectedDateRange === 'week' ? 'primary' : 'medium'"
            (click)="selectedDateRange = 'week'; onFilterChange()"
          >
            <ion-label>This Week</ion-label>
          </ion-chip>

          <ion-chip
            class="blue-chip"
            [color]="selectedDateRange === 'month' ? 'primary' : 'medium'"
            (click)="selectedDateRange = 'month'; onFilterChange()"
          >
            <ion-label>This Month</ion-label>
          </ion-chip>
        </div>
      </div>

      <div class="results" *ngIf="filteredResults.length">
        <app-concert-card-full
          class="search-page"
          *ngFor="let concert of filteredResults"
          [title]="concert.title"
          [date]="concert.date"
          [location]="concert.city_name + ', ' + concert.venue_name"
          [image]="concert.image"
          [genre]="concert.genre"
          [artist]="concert.artist_name"
          [attending]="concert.is_attending"
          [loggedIn]="loggedIn"
          [ticket_available]="concert.ticket_available"
          (click)="openDetails(concert)"
        ></app-concert-card-full>
      </div>

      <div *ngIf="filteredResults.length === 0 && searchQuery">
        <p>No concerts found for "{{ searchQuery }}"</p>
      </div>
    </div>
  </div>
</ion-content>
