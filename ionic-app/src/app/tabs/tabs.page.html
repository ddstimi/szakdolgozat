<div id="base">
  <ion-header [translucent]="true">
    <ion-toolbar>
      <ion-searchbar
        [(ngModel)]="searchQuery"
        (ionInput)="onSearchChange($event)"
        (ionClear)="onSearchChange($event)"
        placeholder="Search"
        #searchBar
      >
      </ion-searchbar>
    </ion-toolbar>
  </ion-header>
</div>
<ion-router-outlet id="content"></ion-router-outlet>

<ion-tabs id="tabs">
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="home" routerLink="/tabs/home">
      <ion-icon name="home"></ion-icon>
    </ion-tab-button>

    <ion-tab-button tab="search" routerLink="/tabs/search">
      <ion-icon name="search"></ion-icon>
    </ion-tab-button>

    <ion-tab-button tab="events" routerLink="/tabs/events">
      <ion-icon name="calendar-outline"></ion-icon>
      <ion-badge color="primary" *ngIf="upcomingNum>0"
        >{{upcomingNum}}</ion-badge
      >
    </ion-tab-button>

    <ion-tab-button tab="profile" routerLink="/tabs/profile">
      <ion-icon name="person"></ion-icon>
      <ion-badge color="primary" *ngIf="notifNum>0">{{notifNum}}</ion-badge>
    </ion-tab-button>

    <ion-tab-button
      id="logout-button"
      (click)="onLogout()"
      class="g_id_signout"
      [style.display]="loggedIn ? 'block' : 'none'"
    >
      <ion-icon name="log-out-outline"></ion-icon>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
