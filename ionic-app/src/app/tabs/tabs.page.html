<ion-tabs id="base">
  <ion-header [translucent]="true">
    <ion-toolbar>
      <ion-searchbar
        [(ngModel)]="searchQuery"
        (ionInput)="onSearch()"
        showCancelButton="never"
        id="global-searchbar"
      ></ion-searchbar>
    </ion-toolbar>
  </ion-header>

  <ion-router-outlet id="content"></ion-router-outlet>

  <ion-tabs id="tabs">
    <ion-tab-bar slot="bottom">
      <ion-tab-button tab="home" routerLink="/tabs/home">
        <ion-icon name="home"></ion-icon>
      </ion-tab-button>

      <ion-tab-button tab="search" routerLink="/tabs/search">
        <ion-icon name="search"></ion-icon>
      </ion-tab-button>

      <ion-tab-button tab="events" routerLink="/tabs/events">
        <ion-icon name="calendar-outline"></ion-icon>
        <ion-badge color="primary">16</ion-badge>
      </ion-tab-button>

      <ion-tab-button tab="profile" routerLink="/tabs/profile">
        <ion-icon name="person"></ion-icon>
        <ion-badge color="primary">3</ion-badge>
      </ion-tab-button>

      <ion-tab-button
        id="logout-button"
        (click)="onLogout()"
        class="g_id_signout"
        [style.display]="loggedIn ? 'visible' : 'none'"
      >
        <ion-icon name="log-out-outline"></ion-icon>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-tabs>
</ion-tabs>
