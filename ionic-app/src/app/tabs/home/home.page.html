<ion-content [fullscreen]="true">
  <div id="container">
    <img id="concert" src="../../../assets/images/aa.jpg" alt="concert" />
    <div id="concert-container">
      <ion-button
        [style.display]="loggedIn ? 'none' : 'visible'"
        id="sign-in-btn"
        type="button"
        (click)="openLogin()"
        class="glow"
        >Sign in</ion-button
      >
    </div>
    <h1>Top picks</h1>

    <div class="concert-scroll-wrapper">
      <div class="concert-scroll-container">
        <app-concert-card
          *ngFor="let concert of topPicks"
          [title]="concert.title"
          [date]="concert.date"
          [location]="concert.city_name + ' • ' + concert.venue_name"
          [image]="concert.image"
          [ticket_available]="concert.ticket_available"
          (click)="openDetails(concert)"
        >
        </app-concert-card>
      </div>
    </div>
    <hr class="section-divider" />

    <h1 id="near">Popular</h1>
    <div class="results">
      <app-concert-card-full
        class="search-page"
        *ngFor="let concert of popular"
        [title]="concert.title"
        [date]="concert.date"
        [location]="concert.city_name"
        [image]="concert.image"
        [genre]="concert.genre"
        [artist]="concert.artist_name"
        [ticket_available]="concert.ticket_available"
        [loggedIn]="loggedIn"
        [attending]="userAttendingConcerts.includes(concert.id)"
        (click)="openDetails(concert)"
      ></app-concert-card-full>
    </div>
  </div>
</ion-content>
