<ion-card class="concert-card">
  <ion-img [src]="image" alt="Concert image"></ion-img>
  <ion-card-header>
    <ion-card-title>{{ title }}</ion-card-title>
    <ion-card-content>
      {{ location }}
    </ion-card-content>
    <div id="flex">
      <ion-card-subtitle>
        <ion-icon name="calendar-outline"></ion-icon
        >{{ date | date : "yyyy-MM-dd • HH:mm" }}</ion-card-subtitle
      >
      <ion-icon
        name="ticket-outline"
        id="checkmark"
        [ngStyle]="{ color: ticket_available ? '#28fdab' : '#ff4d4d' }"
      ></ion-icon>
    </div>
  </ion-card-header>
</ion-card>
