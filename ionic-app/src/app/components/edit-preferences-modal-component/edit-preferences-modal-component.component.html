<ion-content class="modal-content">
  <div class="modal-container">
    <ion-header>
      <ion-toolbar>
        <ion-title>Edit Preferences</ion-title>
        <ion-button fill="clear" slot="end" (click)="closeModal()"
          >Close</ion-button
        >
      </ion-toolbar>
    </ion-header>
    <ion-list>
      <ion-item>
        <ion-label position="stacked">Add Genre</ion-label>
        <ion-input
          [(ngModel)]="selectedGenre"
          placeholder="e.g., Rock"
        ></ion-input>
      </ion-item>
      <ion-button
        expand="block"
        size="small"
        (click)="add('genre')"
        fill="outline"
        class="glow"
        >Add Genre</ion-button
      >

      <ion-item>
        <ion-label>Selected Genres</ion-label>
        <div class="chip-group">
          <ion-chip *ngFor="let genre of genres; let i = index">
            {{ genre }}
            <ion-icon
              name="close-circle"
              (click)="remove('genre', i)"
            ></ion-icon>
          </ion-chip>
        </div>
      </ion-item>

      <hr class="section-divider" />

      <ion-item>
        <ion-label position="stacked">Add Location</ion-label>
        <ion-input
          [(ngModel)]="selectedLocation"
          placeholder="e.g., Budapest"
        ></ion-input>
      </ion-item>
      <ion-button
        expand="block"
        size="small"
        (click)="add('location')"
        fill="outline"
        class="glow"
        >Add Location</ion-button
      >

      <ion-item>
        <ion-label>Selected Locations</ion-label>
        <div class="chip-group">
          <ion-chip *ngFor="let location of locations; let i = index">
            {{ location }}
            <ion-icon
              name="close-circle"
              (click)="remove('location', i)"
            ></ion-icon>
          </ion-chip>
        </div>
      </ion-item>

      <hr class="section-divider" />

      <ion-item>
        <ion-label position="stacked">Add Artist</ion-label>
        <ion-input
          [(ngModel)]="selectedArtist"
          placeholder="e.g., Imagine Dragons"
        ></ion-input>
      </ion-item>
      <ion-button
        expand="block"
        size="small"
        (click)="add('artist')"
        fill="outline"
        class="glow"
        >Add Artist</ion-button
      >

      <ion-item>
        <ion-label>Selected Artists</ion-label>
        <div class="chip-group">
          <ion-chip *ngFor="let artist of artists; let i = index">
            {{ artist }}
            <ion-icon
              name="close-circle"
              (click)="remove('artist', i)"
            ></ion-icon>
          </ion-chip>
        </div>
      </ion-item>
    </ion-list>
    <hr class="section-divider" />
    <ion-item>
      <ion-checkbox justify="start"
        >Show cancelled concerts</ion-checkbox
      ></ion-item
    >
    <hr class="section-divider" />
    <ion-item>
      <ion-checkbox justify="start"
        >Show sold out concerts</ion-checkbox
      ></ion-item
    >
    <ion-button
      expand="block"
      color="primary"
      (click)="savePrefs()"
      id="save"
      fill="outline"
      class="glow"
      >Save</ion-button
    >
  </div>
</ion-content>
